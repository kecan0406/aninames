name: release

on:
  schedule:
    - cron: '17 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANINAMES_DANBOORU: https://shima.donmai.us
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: mise run ci
      - run: bun src/cli.ts fetch
      - run: bun src/cli.ts stage
      - run: bun src/cli.ts build
      - run: bun src/cli.ts eval
      - run: bun src/cli.ts pack
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y-%m-%d)"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/release/* --title "$tag" --notes-file dist/release/NOTICE.md --latest
          gh release list --limit 100 --json tagName --jq '.[4:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done
