name: release

on:
  schedule:
    - cron: '17 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      ANINAMES_DANBOORU: https://shima.donmai.us
      ANINAMES_DANBOORU_LOGIN: ${{ secrets.DANBOORU_LOGIN }}
      ANINAMES_DANBOORU_KEY: ${{ secrets.DANBOORU_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - run: bun install --frozen-lockfile
      - run: mise run ci
      - name: Keep the last answers of Danbooru and Wikidata for a week they do not answer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for source in danbooru wikidata; do
            mkdir -p ".cache/raw/$source"
            if gh release download --pattern "$source.tar.gz" --dir .cache; then
              tar -xzf ".cache/$source.tar.gz" -C ".cache/raw/$source"
            fi
          done
      - name: Build from the sources
        run: |
          bun src/cli.ts fetch
          bun src/cli.ts stage
          bun src/cli.ts build
          bun src/cli.ts pack
          bun src/cli.ts chunk
          for source in danbooru wikidata; do
            tar -czf "dist/release/$source.tar.gz" -C ".cache/raw/$source" .
          done
      - name: Audit before anything is published
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER_CLIENT: '0.8'
        run: |
          bun src/cli.ts eval
          assets="$(gh release view --json assets --jq '.assets[].name')"
          if grep -qx stats.json <<<"$assets"; then
            gh release download --pattern stats.json --dir .cache/previous
          fi
          clients=()
          for version in "$CONSUMER_CLIENT" latest; do
            mkdir -p ".cache/client/$version"
            (cd ".cache/client/$version" && npm pack "@kecan0406/aninames@$version" --silent && tar -xzf kecan0406-aninames-*.tgz)
            clients+=("$PWD/.cache/client/$version/package")
          done
          bun src/cli.ts audit .cache/previous/stats.json "${clients[@]}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y-%m-%d)"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/release/* --title "$tag" --notes-file dist/release/NOTICE.md --latest
          gh release list --limit 100 --json tagName --jq '.[4:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
