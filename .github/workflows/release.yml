name: release

on:
  schedule:
    - cron: '17 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      fresh: ${{ steps.fresh.outcome }}
    env:
      ANINAMES_DANBOORU: https://shima.donmai.us
      ANINAMES_DANBOORU_LOGIN: ${{ secrets.DANBOORU_LOGIN }}
      ANINAMES_DANBOORU_KEY: ${{ secrets.DANBOORU_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: mise run ci
      - name: Keep the last answers of Danbooru and Wikidata for a week they do not answer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for source in danbooru wikidata; do
            mkdir -p ".cache/raw/$source"
            if gh release download --pattern "$source.tar.gz" --dir .cache; then
              tar -xzf ".cache/$source.tar.gz" -C ".cache/raw/$source"
            fi
          done
      - name: Build from the sources
        id: fresh
        continue-on-error: true
        run: |
          bun src/cli.ts fetch
          bun src/cli.ts stage
          bun src/cli.ts build
          bun src/cli.ts eval
          bun src/cli.ts pack
          for source in danbooru wikidata; do
            tar -czf "dist/release/$source.tar.gz" -C ".cache/raw/$source" .
          done
      - name: Take the latest data release when the sources did not load
        if: steps.fresh.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist
          gh release download --pattern '*.sqlite.zst' --dir dist/release
          bun src/cli.ts unpack
      - run: bun src/cli.ts chunk
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - name: Publish
        if: steps.fresh.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y-%m-%d)"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/release/* --title "$tag" --notes-file dist/release/NOTICE.md --latest
          gh release list --limit 100 --json tagName --jq '.[4:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes
          done

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  stale:
    needs: [release, pages]
    if: needs.release.outputs.fresh != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::The sources did not load, so the site was built from the latest data release"
          exit 1
