[tools]
bun = "1.3"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.fetch]
description = "download every source's raw data into .cache/raw (or only the sources named)"
run = "bun src/cli.ts fetch"

[tasks.stage]
description = "parse raw data into .cache/stage/<source>.jsonl (or only the sources named)"
run = "bun src/cli.ts stage"

[tasks.build]
description = "merge the staged sources into one SQLite file per layer in dist/"
run = "bun src/cli.ts build"

[tasks.pack]
description = "zstd-compress the built files into dist/release for publishing"
run = "bun src/cli.ts pack"

[tasks.chunk]
description = "cut the built layers' search keys into the static site in dist/site: mise run chunk [bytes per file]"
run = "bun src/cli.ts chunk"

[tasks.compare]
description = "search the probe sample with SQLite and with the client over dist/site, and compare: mise run compare [per band]"
run = "bun src/cli.ts compare"

[tasks.lib]
description = "compile the client library into lib/ for the npm package"
run = "rm -rf lib && tsc -p tsconfig.lib.json"

[tasks.search]
description = "search the built layers: mise run search <query>"
run = "bun src/cli.ts search"

[tasks.eval]
description = "run the golden queries against the built layers"
run = "bun src/cli.ts eval"

[tasks.probe]
description = "search popular entities by perturbed forms of their own names: mise run probe [sample size]"
run = "bun src/cli.ts probe"

[tasks.silver]
description = "measure character merging against the cross-source ids it is not shown"
run = "bun src/cli.ts silver"

[tasks.han]
description = "rebuild src/han.txt, the Han variants every merge key folds into one character, from Unicode's Unihan and OpenCC's shinjitai table"
run = "bun src/cli.ts han"

[tasks.test]
description = "unit tests"
run = "bun test"

[tasks.check]
description = "typecheck, and the client library alone against Node's types"
run = ["tsc --noEmit", "tsc -p tsconfig.lib.json --noEmit"]

[tasks.lint]
description = "biome lint + format check + import order"
run = "biome check ."

[tasks.format]
description = "apply biome fixes"
run = "biome check --write ."

[tasks.ci]
description = "lint + typecheck + tests"
depends = ["lint", "check", "test"]
